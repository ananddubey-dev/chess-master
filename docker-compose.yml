services:
  db:
    image: postgres:16-alpine
    container_name: kingdom-chess-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kingdom_chess}
      POSTGRES_USER: ${POSTGRES_USER:-kingdom_chess}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kingdom_chess} -d ${POSTGRES_DB:-kingdom_chess}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
